# mpv video output fix
#
# Problem: mpv defaults to gpu-api=auto -> Vulkan, and libplacebo prefers the
# discrete GPU (NVIDIA GT 730M / legacy 470 driver). That driver cannot create
# a Wayland swapchain -> VK_ERROR_INITIALIZATION_FAILED forever -> no video,
# audio only.
#
# The actual display is driven by the Intel HD 4600 (Mesa), so force OpenGL:

vo=gpu-next
gpu-api=opengl

# Falls back to software decoding automatically. To enable VA-API hardware
# decoding, install the Haswell driver: sudo pacman -S libva-intel-driver
# (note: intel-media-driver is Broadwell+ and will NOT work on this GPU).
hwdec=auto-safe
